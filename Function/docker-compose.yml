    command: >
      gunicorn -k uvicorn.workers.UvicornWorker
      app.main:app
      -b 0.0.0.0:5000
      --workers ${WEB_CONCURRENCY:-2}
      --timeout ${GUNICORN_TIMEOUT:-60}
      --access-logfile -
      --error-logfile -
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: docker-website
    ports:
      - "8080:80"
    volumes:
      # 把 website 靜態檔掛到 nginx 的網站根目錄
      - ./website:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/line_content:/app/data/line_content
    depends_on:
      - api
    restart: unless-stopped

  web-angular:
    image: nginx:alpine
    container_name: docker-angular
    ports:
      - "8081:80"
    volumes:
      - ./website-angular:/usr/share/nginx/html:ro
      - ./nginx/angular.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  cloudflared:
