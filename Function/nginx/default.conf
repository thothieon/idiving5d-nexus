server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # =================================================
  # 反向代理：先攔 API 路徑（順序很重要，長路徑優先）
  # =================================================

  # 公開 API（課程排程等，無需驗證）
  location ^~ /api/ {
    proxy_pass         http://api:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
  }

  # 所有後台 API（tickets / staff / audiences / groups / sessions / booking 等）
  location ^~ /admin/api/ {
    proxy_pass         http://api:5000/admin/api/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
  }

  # 後台 UI 頁面（Jinja2 render）
  location ^~ /admin/ui {
    proxy_pass         http://api:5000/admin/ui;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # LINE Webhook callback
  location ^~ /callback {
    proxy_pass         http://api:5000/callback;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
  }

  # LIFF 匯款 API — 只代理兩個特定 POST 端點
  location = /liff/payment/orders {
    proxy_pass         http://api:5000/liff/payment/orders;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
  }

  location = /liff/payment/submit {
    proxy_pass         http://api:5000/liff/payment/submit;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
  }

  # 健康檢查
  location ^~ /health {
    proxy_pass         http://api:5000/health;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # =================================================
  # Angular SPA：其餘路徑一律回 index.html
  # =================================================
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 靜態資源快取
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }
}