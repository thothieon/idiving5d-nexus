<section class="wrap">
  <div class="card">
    <h1>客服後台</h1>

    <div class="field">
      <label>帳號</label>
      <input
        type="text"
        [(ngModel)]="username"
        placeholder="請輸入帳號"
        autocomplete="username"
        (keydown)="onKeydown($event)"
      />
    </div>

    <div class="field">
      <label>密碼</label>
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="請輸入密碼"
        autocomplete="current-password"
        (keydown)="onKeydown($event)"
      />
    </div>

    <button class="btn" (click)="login()" [disabled]="loading || !username.trim() || !password.trim()">
      {{ loading ? '登入中…' : '登入' }}
    </button>

    <div class="err" *ngIf="errorMsg">{{ errorMsg }}</div>
  </div>
</section>
