<ng-container *ngIf="!isLiff()">
  <header class="topbar">
    <div class="brand">
      <div class="dot"></div>
      <div class="title">iDiving NEXUS 客服後台</div>
      <span class="user-name">{{ staffName() }}</span>
    </div>

    <ng-container *ngIf="hasToken(); else notLoggedIn">
      <button class="ghost logout-btn" (click)="clearToken()">登出</button>
    </ng-container>
    <ng-template #notLoggedIn>
      <a routerLink="/admin/login" class="link warn">請登入</a>
    </ng-template>
  </header>

  <nav class="topnav" *ngIf="hasToken()">
    <a routerLink="/admin/turn"        class="link">🎫 客服後台</a>
    <a routerLink="/admin/questions"    class="link" *ngIf="canQuestions()">問題蒐集</a>
    <a routerLink="/admin/courses"      class="link" *ngIf="canCourses()">課程排程</a>
    <a routerLink="/admin/registration" class="link" *ngIf="canRegistration()">📋 報名管理</a>
    <a routerLink="/admin/customers"    class="link" *ngIf="canCustomers()">👤 客戶管理</a>
    <a routerLink="/admin/pagestats"    class="link" *ngIf="canPagestats()">📊 頁面分析</a>
    <a routerLink="/admin/linestats"    class="link" *ngIf="canLinestats()">📊 LINE 分析</a>
    <a routerLink="/admin/rag"           class="link" *ngIf="isAdmin()">📚 知識庫</a>
    <a routerLink="/admin/staff"        class="link" *ngIf="isAdmin()">👥 帳號管理</a>
  </nav>
</ng-container>

<main class="main">
  <router-outlet />
</main>

<ng-container *ngIf="!isLiff()">
  <nav class="bottom-nav">
    <a routerLink="/admin/turn" routerLinkActive="active">工作台</a>
    <a routerLink="/admin/login" routerLinkActive="active" *ngIf="!hasToken()">登入</a>
  </nav>
</ng-container>
